<svg xmlns="http://www.w3.org/2000/svg" width="700" height="204" viewBox="0 0 700 204" role="img" aria-labelledby="title desc"><title id="title">S3 — Trois rôles fonctionnels</title><desc id="desc">Administrateur : prépare et gère. Créateur : crée et suit les sondages autorisés. Participant : répond et consulte selon ses droits. Aucun âge ou métier ne définit ces rôles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#684397"/></marker></defs><g font-family="DejaVu Sans,sans-serif" fill="#25334b"><rect x="5" y="6" width="220" height="54" rx="9" fill="#f1ecf7" stroke="#684397" stroke-width="2"/><text x="115.0" y="40.0" text-anchor="middle" font-size="20">Administrateur</text><path d="M225 33 L260 33" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="265" y="6" width="430" height="54" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="480.0" y="40.0" text-anchor="middle" font-size="18">Prépare et gère l’Espace</text><rect x="5" y="74" width="220" height="54" rx="9" fill="#f1ecf7" stroke="#684397" stroke-width="2"/><text x="115.0" y="108.0" text-anchor="middle" font-size="20">Créateur</text><path d="M225 101 L260 101" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="265" y="74" width="430" height="54" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="480.0" y="108.0" text-anchor="middle" font-size="18">Crée et suit les sondages autorisés</text><rect x="5" y="142" width="220" height="54" rx="9" fill="#f1ecf7" stroke="#684397" stroke-width="2"/><text x="115.0" y="176.0" text-anchor="middle" font-size="20">Participant</text><path d="M225 169 L260 169" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="265" y="142" width="430" height="54" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="480.0" y="176.0" text-anchor="middle" font-size="18">Répond et consulte selon ses droits</text></g></svg>