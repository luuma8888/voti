<svg xmlns="http://www.w3.org/2000/svg" width="700" height="245" viewBox="0 0 700 245" role="img" aria-labelledby="title desc"><title id="title">S1 — Organisation de Voti</title><desc id="desc">Un Espace rassemble membres, groupes et sondages. Chaque membre possède une Carte. Les groupes rassemblent des membres et servent à cibler les sondages.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#684397"/></marker></defs><g font-family="DejaVu Sans,sans-serif" fill="#25334b"><rect x="255" y="8" width="190" height="45" rx="9" fill="#f1ecf7" stroke="#684397" stroke-width="2"/><text x="350.0" y="37.5" text-anchor="middle" font-size="22">Espace</text><path d="M350 53 L115 91" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M350 53 L350 91" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M350 53 L585 91" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="10" y="95" width="210" height="49" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="115.0" y="126.5" text-anchor="middle" font-size="20">Membres</text><rect x="245" y="95" width="210" height="49" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="350.0" y="126.5" text-anchor="middle" font-size="20">Groupes</text><rect x="480" y="95" width="210" height="49" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="585.0" y="126.5" text-anchor="middle" font-size="20">Sondages</text><path d="M245 119 L222 119" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M455 119 L478 119" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M115 144 L115 181" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="10" y="185" width="210" height="48" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="115.0" y="216.0" text-anchor="middle" font-size="20">Cartes Voti</text><text x="260" y="185" font-size="18">Groupes : rassemblent des membres.</text><text x="260" y="216" font-size="18">Sondages : tout l’Espace ou des groupes.</text></g></svg>