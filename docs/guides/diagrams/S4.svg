<svg xmlns="http://www.w3.org/2000/svg" width="700" height="181" viewBox="0 0 700 181" role="img" aria-labelledby="title desc"><title id="title">S4 — Pourquoi attendre les résultats ?</title><desc id="desc">Minimum atteint plus condition choisie satisfaite plus personne autorisée : résultats disponibles. Les trois conditions sont nécessaires.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#684397"/></marker></defs><g font-family="DejaVu Sans,sans-serif" fill="#25334b"><rect x="5" y="5" width="210" height="66" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="110.0" y="32.5" text-anchor="middle" font-size="18">Minimum</text><text x="110.0" y="57.5" text-anchor="middle" font-size="18">atteint</text><rect x="245" y="5" width="210" height="66" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="350.0" y="32.5" text-anchor="middle" font-size="18">Condition choisie</text><text x="350.0" y="57.5" text-anchor="middle" font-size="18">satisfaite</text><rect x="485" y="5" width="210" height="66" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="590.0" y="32.5" text-anchor="middle" font-size="18">Personne</text><text x="590.0" y="57.5" text-anchor="middle" font-size="18">autorisée</text><text x="230" y="48" text-anchor="middle" font-size="27">+</text><text x="470" y="48" text-anchor="middle" font-size="27">+</text><path d="M350 78 L350 113" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="150" y="118" width="400" height="53" rx="9" fill="#f1ecf7" stroke="#684397" stroke-width="2"/><text x="350.0" y="151.5" text-anchor="middle" font-size="22">Résultats disponibles</text></g></svg>