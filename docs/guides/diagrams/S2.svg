<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350" role="img" aria-labelledby="title desc"><title id="title">S2 — Du sondage au vote</title><desc id="desc">Créateur ou Administrateur publie. Le Participant présente sa Carte, choisit, confirme. Le vote est enregistré. Les résultats suivent les règles choisies.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#684397"/></marker></defs><g font-family="DejaVu Sans,sans-serif" fill="#25334b"><rect x="55" y="6" width="590" height="43" rx="9" fill="#f1ecf7" stroke="#684397" stroke-width="2"/><text x="350.0" y="34.5" text-anchor="middle" font-size="20">Créateur / Administrateur publie</text><path d="M350 49 L350 62" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="64" width="590" height="43" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="350.0" y="92.5" text-anchor="middle" font-size="20">Participant présente sa Carte Voti</text><path d="M350 107 L350 120" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="122" width="590" height="43" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="350.0" y="150.5" text-anchor="middle" font-size="20">Choisit sa réponse</text><path d="M350 165 L350 178" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="180" width="590" height="43" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="350.0" y="208.5" text-anchor="middle" font-size="20">Confirme son choix</text><path d="M350 223 L350 236" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="238" width="590" height="43" rx="9" fill="#fff" stroke="#b8b0c5" stroke-width="2"/><text x="350.0" y="266.5" text-anchor="middle" font-size="20">Vote enregistré</text><path d="M350 281 L350 294" stroke="#684397" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="296" width="590" height="43" rx="9" fill="#f1ecf7" stroke="#684397" stroke-width="2"/><text x="350.0" y="324.5" text-anchor="middle" font-size="20">Résultats selon les règles</text></g></svg>